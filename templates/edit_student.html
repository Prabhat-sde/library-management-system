<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student | LibraryMS</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/edit_student.css') }}">

</head>


<body>


    <div class="form-container">


        <div class="page-icon">
            ✏️
        </div>


        <div class="brand">
            📚 LIBRARY MANAGEMENT SYSTEM
        </div>


        <h1>
            Edit Student
        </h1>


        <p class="subtitle">
            Update the student's information
        </p>


        <form method="POST" action="{{ url_for('edit_student', id=student.id) }}">


            <div class="form-group">

                <label for="name">
                    Student Name
                </label>

                <input type="text" id="name" name="name" value="{{ student.name }}" placeholder="Enter student name"
                    required>

            </div>


            <div class="form-group">

                <label for="roll_no">
                    Roll Number
                </label>

                <input type="text" id="roll_no" name="roll_no" value="{{ student.roll_no }}"
                    placeholder="Enter roll number" required>

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input type="email" id="email" name="email" value="{{ student.email }}"
                    placeholder="Enter email address" required>

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input type="text" id="phone" name="phone" value="{{ student.phone }}" placeholder="Enter phone number"
                    required>

            </div>


            <div class="form-group">

                <label for="course">
                    Course
                </label>

                <input type="text" id="course" name="course" value="{{ student.course }}" placeholder="Enter course"
                    required>

            </div>


            <div class="buttons">

                <button type="submit">

                    💾 Update Student

                </button>


                <a href="{{ url_for('students') }}" class="cancel-btn">

                    ← Cancel

                </a>

            </div>


        </form>


    </div>


</body>

</html>
